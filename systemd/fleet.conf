# Install as /etc/systemd/system/pi-tg.service.d/fleet.conf only after tests and backup.
[Service]
ExecStart=
ExecStart=/usr/bin/env node /opt/pi-tg/src/fleet/main.ts /etc/pi-tg/config.json
# Workers are moved into per-task cgroups before running any agent task.
Delegate=yes
ProtectControlGroups=no
KillMode=control-group
TimeoutStopSec=30
MemoryMax=4G
TasksMax=512
